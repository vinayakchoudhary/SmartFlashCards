{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block body %}
    {% if error != "" %}
        <p style="color:red;">{{error}}</p>
    {% endif %}
    <form action="/register" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="username" placeholder="Username" type="text" required>
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="password" placeholder="Password" type="password" required>
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="confirmation" placeholder="Confirm Password" type="password" required>
        </div>
        <button class="btn btn-primary" type="submit" style="margin:auto;">Register</button>
    </form>
    <form action="./login" method="get">
        <p style="margin:1rem;">Already have an account? <a href="/login">Click here</a></p>
    </form>
{% endblock %}
