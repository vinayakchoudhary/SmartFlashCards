<!DOCTYPE html>

<html lang="en" style="margin: 0; padding: 0; height: 100%; width: 100%;">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">

        <!-- http://getbootstrap.com/docs/5.3/ -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

        <link href="/static/favicon.ico" rel="icon">
        <title>
            {% block title %}{% endblock %}
        </title>
    </head>
    <body style="margin: 0; padding: 0; height: 100%; width: 100%; background-color:#dfdfdf">


        <nav class="bg-light border navbar navbar-expand-md navbar-dark bg-dark">
            <!--code for style/ design taken for finance(problem set-9)-->
            <div class="container-fluid">
                <div class="collapse navbar-collapse" id="navbar">

                   {% if "username" in session %}
                        <ul class="navbar-nav me-auto mt-2">
                            <li class="nav-item" style="margin-left:1rem;"><img src="/static/image.png" style="height:3rem" alt="logo"></li>
                            <li class="nav-item" style="margin-left:1rem;"><a class="nav-link" href="/">Home</a></li>
                            <li class="nav-item" style="margin-left:1rem;"><a class="nav-link" href="/cards">Flash Cards</a></li>
                            <li class="nav-item" style="margin-left:1rem;"><a class="nav-link" href="/tags">Tags</a></li>
                            <li class="nav-item" style="margin-left:1rem;"><a class="nav-link" href="/archivedCards">Archived Flash Cards</a></li>
                        </ul>
                        <ul class="navbar-nav ms-auto mt-2">
                            <li class="nav-item"><a class="nav-link" href="/logout">Log Out</a></li>
                        </ul>
                        {% else %}
                        <ul class="navbar-nav ms-auto mt-2">
                            <li class="nav-item"><a class="nav-link" href="/register">Register</a></li>
                            <li class="nav-item"><a class="nav-link" href="/login">Log In</a></li>
                        </ul>
                        {% endif %}

                </div>
            </div>
        </nav>
        <main class="container py-5 text-center">
        {% block body %}

        {% endblock %}
        </main>
    </body>
</html>
